<body><main><h1>Necesitas conexión a internet</h1><p>No se pudo cargar Inventario UEGIR. La ficha y los mantenimientos se consultan en Supabase; no hay una copia sin conexión de esos datos.</p><p>Conéctate a internet y vuelve a intentarlo. Si abriste un QR, «Reintentar» conserva su dirección.</p><button type="button" id="reintentar">Reintentar</button><p><a href="index.html">Ir al inventario</a></p></main><script>document.getElementById('reintentar').addEventListener('click',()=>location.reload());</script></body></html>
